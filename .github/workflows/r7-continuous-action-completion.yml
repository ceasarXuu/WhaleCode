name: r7-continuous-action-completion

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: Promotion commit to verify
        required: true
        type: string
  push:
    paths:
      - benchmarks/taskspace/r7/five-layer-contract-authority-v1.json
      - third_party/codex-cli/codex-rs/core/src/context/prompts/taskspace_contract_manifest_v1.json

permissions:
  contents: read

jobs:
  verify:
    name: r7-continuous-action-completion
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_COMMIT: ${{ inputs.target_commit || github.sha }}
      ANCHOR_PATH: benchmarks/taskspace/r7/continuous-action-v2-toolchain-anchor-v1.json
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_commit || github.sha }}

      - name: Export pinned launcher
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t history < <(git log --first-parent --reverse --format=%H "$TARGET_COMMIT" -- "$ANCHOR_PATH")
          test "${#history[@]}" -eq 1
          toolchain_add="${history[0]}"
          parent="$(git rev-parse "${toolchain_add}^1")"
          test "$(git show "${toolchain_add}:${ANCHOR_PATH}" | jq -r .anchor_kind)" = continuous_action_v2_toolchain
          test "$(git show "${toolchain_add}:${ANCHOR_PATH}" | jq -r .anchored_parent_commit)" = "$parent"
          launcher_path="$(git show "${toolchain_add}:${ANCHOR_PATH}" | jq -r '.artifacts[] | select(.role == "completion_launcher") | .path')"
          launcher_hash="$(git show "${toolchain_add}:${ANCHOR_PATH}" | jq -r '.artifacts[] | select(.role == "completion_launcher") | .sha256')"
          test -n "$launcher_path"
          git show "${parent}:${launcher_path}" > "$RUNNER_TEMP/invoke-r7-continuous-action-completion.ps1"
          test "$(sha256sum "$RUNNER_TEMP/invoke-r7-continuous-action-completion.ps1" | awk '{print $1}')" = "$launcher_hash"
          echo "toolchain_add=$toolchain_add" >> "$GITHUB_OUTPUT"
          echo "launcher=$RUNNER_TEMP/invoke-r7-continuous-action-completion.ps1" >> "$GITHUB_OUTPUT"

      - name: Run pinned completion verifier
        shell: pwsh
        run: |
          & "${{ steps.bootstrap.outputs.launcher }}" `
            -RepoRoot "$env:GITHUB_WORKSPACE" `
            -TargetCommit "$env:TARGET_COMMIT" `
            -ToolchainAddCommit "${{ steps.bootstrap.outputs.toolchain_add }}" `
            -RequiredCheckRunId "$env:GITHUB_RUN_ID" `
            -RequiredCheckName "r7-continuous-action-completion" `
            -AttestationPath "$env:RUNNER_TEMP/r7-continuous-action-attestation.json"

      - name: Publish attestation
        uses: actions/upload-artifact@v7
        with:
          name: r7-continuous-action-attestation-${{ github.run_id }}
          path: ${{ runner.temp }}/r7-continuous-action-attestation.json
          if-no-files-found: error
          retention-days: 30
