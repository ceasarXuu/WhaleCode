name: r7-continuous-action-completion

on:
  push:
    paths:
      - benchmarks/taskspace/r7/five-layer-contract-authority-v1.json
      - third_party/codex-cli/codex-rs/core/src/context/prompts/taskspace_contract_manifest_v1.json

permissions:
  contents: read

jobs:
  verify:
    name: r7-continuous-action-completion
    runs-on: ubuntu-latest
    container:
      image: rust@sha256:7274e0edb5b47eda8053b350ebf3d489f7e0f65d2d7e77b16076299c7c047c28
    timeout-minutes: 45
    env:
      TARGET_COMMIT: ${{ github.sha }}
      ANCHOR_PATH: benchmarks/taskspace/r7/continuous-action-v2-toolchain-anchor-v1.json
      R7_EXECUTION_IMAGE: docker.io/library/rust@sha256:7274e0edb5b47eda8053b350ebf3d489f7e0f65d2d7e77b16076299c7c047c28
      R7_POWERSHELL_URL: https://github.com/PowerShell/PowerShell/releases/download/v7.5.4/powershell-7.5.4-linux-x64.tar.gz
      R7_POWERSHELL_SHA256: 1fd7983fe56ca9e6233f126925edb24bf6b6b33e356b69996d925c4db94e2fef
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install pinned PowerShell
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/powershell-7.5.4-linux-x64.tar.gz"
          install_root="$RUNNER_TEMP/powershell-7.5.4"
          curl -fsSL "$R7_POWERSHELL_URL" -o "$archive"
          echo "$R7_POWERSHELL_SHA256  $archive" | sha256sum -c -
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root"
          chmod 0755 "$install_root/pwsh"
          echo "$install_root" >> "$GITHUB_PATH"
          echo "R7_POWERSHELL_ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"
          "$install_root/pwsh" -NoLogo -NoProfile -Command "\$PSVersionTable.PSVersion.ToString()"

      - name: Export pinned launcher
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mapfile -t history < <(git log --first-parent --reverse --format=%H "$TARGET_COMMIT" -- "$ANCHOR_PATH")
          test "${#history[@]}" -eq 1
          toolchain_add="${history[0]}"
          parent="$(git rev-parse "${toolchain_add}^1")"
          test "$(git show "${toolchain_add}:${ANCHOR_PATH}" | jq -r .anchor_kind)" = continuous_action_v2_toolchain
          test "$(git show "${toolchain_add}:${ANCHOR_PATH}" | jq -r .anchored_parent_commit)" = "$parent"
          launcher_path="scripts/taskspace-benchmark/invoke-r7-continuous-action-completion.ps1"
          declared_launcher_path="$(git show "${toolchain_add}:${ANCHOR_PATH}" | jq -r '.artifacts[] | select(.role == "completion_launcher") | .path')"
          launcher_hash="$(git show "${toolchain_add}:${ANCHOR_PATH}" | jq -r '.artifacts[] | select(.role == "completion_launcher") | .sha256')"
          test "$declared_launcher_path" = "$launcher_path"
          git show "${parent}:${launcher_path}" > "$RUNNER_TEMP/invoke-r7-continuous-action-completion.ps1"
          test "$(sha256sum "$RUNNER_TEMP/invoke-r7-continuous-action-completion.ps1" | awk '{print $1}')" = "$launcher_hash"
          echo "toolchain_add=$toolchain_add" >> "$GITHUB_OUTPUT"
          echo "launcher=$RUNNER_TEMP/invoke-r7-continuous-action-completion.ps1" >> "$GITHUB_OUTPUT"

      - name: Run pinned completion verifier
        shell: pwsh
        run: |
          & "${{ steps.bootstrap.outputs.launcher }}" `
            -RepoRoot "$env:GITHUB_WORKSPACE" `
            -TargetCommit "$env:TARGET_COMMIT" `
            -ToolchainAddCommit "${{ steps.bootstrap.outputs.toolchain_add }}" `
            -RequiredCheckRunId "$env:GITHUB_RUN_ID" `
            -RequiredCheckRunAttempt "$env:GITHUB_RUN_ATTEMPT" `
            -RequiredCheckName "r7-continuous-action-completion" `
            -Repository "$env:GITHUB_REPOSITORY" `
            -WorkflowRef "$env:GITHUB_WORKFLOW_REF" `
            -WorkflowSha "$env:GITHUB_WORKFLOW_SHA" `
            -EventName "$env:GITHUB_EVENT_NAME" `
            -GitSha "$env:GITHUB_SHA" `
            -GitRef "$env:GITHUB_REF" `
            -ExecutionImage "$env:R7_EXECUTION_IMAGE" `
            -PowerShellArchivePath "$env:R7_POWERSHELL_ARCHIVE_PATH" `
            -AttestationPath "$env:RUNNER_TEMP/r7-continuous-action-attestation.json"

      - name: Publish attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: r7-continuous-action-attestation-${{ github.run_id }}
          path: ${{ runner.temp }}/r7-continuous-action-attestation.json
          if-no-files-found: error
          retention-days: 30
