name: whale-native-artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Whale product version (without v prefix)
        required: true
        default: 0.0.5

permissions:
  contents: read

concurrency:
  group: whale-native-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate Whale release candidate identity
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$VERSION" = "0.0.5"
          python3 scripts/release/check_release_identity.py --tag "v${VERSION}"
          python3 scripts/release/check_distribution_identity.py
          python3 scripts/release/check_brand_identity.py
          python3 scripts/release/check_native_artifact_workflow.py

  build:
    needs: preflight
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Prepare Linux musl toolchain
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/release/prepare_linux_musl.sh
      - name: Fetch verified upstream V8 build inputs
        shell: bash
        run: python3 scripts/release/prepare_rusty_v8.py --target '${{ matrix.target }}' --github-env "$GITHUB_ENV"
      - name: Build Linux bwrap and bind its digest
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --manifest-path third_party/codex-cli/codex-rs/Cargo.toml --locked --release --target "$TARGET" --bin bwrap
          binary="third_party/codex-cli/codex-rs/target/${TARGET}/release/bwrap"
          strip --strip-debug --strip-unneeded "$binary"
          echo "CODEX_BWRAP_SHA256=$(sha256sum "$binary" | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Build Whale CLI
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          fi
          cargo build --manifest-path third_party/codex-cli/codex-rs/Cargo.toml --locked --release --target "$TARGET" --bin whale
      - name: Package unsigned Whale candidate
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: |
          suffix=""; [[ "$TARGET" == *windows* ]] && suffix=".exe"
          python3 scripts/release/package_native_artifact.py \
            --target "$TARGET" --version "$VERSION" \
            --binary "third_party/codex-cli/codex-rs/target/${TARGET}/release/whale${suffix}" \
            --output "native-dist/${TARGET}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}-unsigned
          path: native-dist/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-unsigned'
          path: native-artifacts
      - name: Verify and assemble six-platform manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/release/build_native_manifest.py \
            --artifacts native-artifacts --version "$VERSION" \
            --output "whale-v${VERSION}-native-manifest.json"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: whale-native-manifest
          path: whale-v${{ inputs.version }}-native-manifest.json
          if-no-files-found: error
          retention-days: 14
