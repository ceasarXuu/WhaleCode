name: release-identity

on:
  workflow_dispatch:
    inputs:
      version:
        description: Whale product version (without v prefix)
        required: true
        default: 0.0.6

permissions:
  contents: read

jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run local release preflight contract
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/release/run_local_preflight.sh "$VERSION"
