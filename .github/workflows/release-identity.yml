name: release-identity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check Whale and Codex release identities
        run: python3 scripts/release/check_release_identity.py --tag v0.0.5
      - name: Check Whale distribution ownership
        run: python3 scripts/release/check_distribution_identity.py
      - name: Check Whale user-visible brand identity
        run: python3 scripts/release/check_brand_identity.py
      - name: Test release identity guard
        run: python3 -m unittest discover -s scripts/release/tests -p 'test_*.py'
